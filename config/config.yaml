sample_type_colors:
  fibroblasts: "#D95D5B"
  lymphocytes: "#57AA3E"
  PBMCs: "#4C8FCA"
  wholeblood: "#B271AB"

cohort_qc_title: "Cohort QC"

gene_quant_title: null

gene_outlier_pseudocount:      1.0
gene_outlier_shrinkage_k:     10.0
gene_outlier_min_mad:          0.1
gene_outlier_zscore_threshold: 3.0

threads: 8
time:    1440