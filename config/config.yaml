merge_delta_psi_threshold:             0.1
merge_jxn_sample_fraction:              0.05

cohort_jxn_min_samples:        10
cohort_jxn_method:       "auto"
cohort_jxn_beta_min_samples:   30
cohort_jxn_beta_padj_threshold: 0.05
cohort_jxn_z_threshold:       3.5
cohort_jxn_z_delta_threshold: 0.1
cohort_jxn_phasing_threshold: 0.8 
cohort_jxn_beta_n_threshold:     30
cohort_jxn_zscore_n_threshold:   10
cohort_jxn_min_reads:          20

