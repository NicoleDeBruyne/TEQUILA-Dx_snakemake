# ---------------------------------------------------------------------------
# RNA-Dx Pipeline Configuration
# Edit paths and thresholds to match your environment. Boolean flags can be
# overridden at the CLI with --config key=True/False.
# See docs/general.md for the full stage layout.
# ---------------------------------------------------------------------------

# Run manifest, injected at runtime by submit_snakemake.sh. Each sample
# entry provides: bam, bed, tissues, sample_type, and optionally an outdir
# override (default: {output_dir}/samples/{sample}/output).
run: ""

# ---------------------------------------------------------------------------
# Pipeline stage booleans
# ---------------------------------------------------------------------------
longcallr:                 true
nanots:                    true
clair3_rna:                true
deepvariant:               true
compile_variants:          true
phase_reads:               true
ase_analysis:               true
junction_analysis:          true
cohort_junction_analysis:   true
merge_hits:                 true
merge_hits_include_cohort_junctions: true
validate_sample_types:      true
plot_cohort_qc:              true
quantify_genes:              true

# conda_env is used by every rule except compile_variants, 
# which uses conda_env_compile_variants instead.
conda_env:        "envs/conda_env"
conda_env_compile_variants: "envs/conda_env_compile_variants"

# Relative paths below resolve against the pipeline directory
genome:     "resources/gencode_data/GRCh38.primary_assembly.genome.fa"
annotation: "resources/gencode_data/gencode.v44.primary_assembly.annotation.gtf"

# ---------------------------------------------------------------------------
# Variant callers (rules/1_call_variants.smk)
# ---------------------------------------------------------------------------
longcallr_bin:    "envs/conda_env/bin/longcallR"
nanots_image:     "library://zelinliu/nanots/nanots:1.0.0"
nanots_model_unphased: "resources/NanoTS/model/unphased_cDNA_nanopore_R104_HG002.pth"
nanots_model_phased:   "resources/NanoTS/model/phased_cDNA_nanopore_R104_HG002.pth"
clair3_rna_image: "docker://hkubal/clair3-rna:v0.2.2"
deepvariant_image: "docker://google/deepvariant:1.6.1"

# ---------------------------------------------------------------------------
# Variant compilation / annotation (rules/2_compile_variants.smk)
# Merges the four callers' VCFs, annotates with gnomAD/ClinVar/ANNOVAR/CADD/SpliceAI. 
# gnomad_base/clinvar_vcf default to local copies (downloaded by setup_resources.sh);
# set to "remote" to use the public URLs instead.
# ---------------------------------------------------------------------------
gnomad_base:         "resources/gnomad_data"
clinvar_vcf:         "resources/clinvar_data/clinvar.vcf.gz"
annovar_dir:         "resources/annovar"
cadd_script:       "resources/CADD-scripts-1.7.1/CADD_wrapper.sh"   # CADD_wrapper.sh, not CADD.sh -- see docs/setup.md
cadd_data_dir:       "resources/CADD-scripts-1.7.1/data"
# Local pre-scored fallback files -- either can be left empty to skip that variant type at this tier.
cadd_local_prescored_snv:   "resources/CADD-scripts-1.7.1/data/prescored/GRCh38_v1.7/no_anno/whole_genome_SNVs.tsv.gz"
cadd_local_prescored_indel: "resources/CADD-scripts-1.7.1/data/prescored/GRCh38_v1.7/no_anno/gnomad.genomes.r4.0.indel.tsv.gz"
cadd_prescored_url:  "https://krishna.gs.washington.edu/download/CADD/v1.7/GRCh38/whole_genome_SNVs.tsv.gz"

# SpliceAI runs live via bioconda by default.
# Prescored VCFs below are an optional fallback -- use the MASKED hg38 files.
spliceai_annotation: "grch38"
spliceai_prescored_snv_vcf:   ""
spliceai_prescored_indel_vcf: ""
spliceai_force_prescored_lookup: false

gnomad_chroms:
  - chr1
  - chr2
  - chr3
  - chr4
  - chr5
  - chr6
  - chr7
  - chr8
  - chr9
  - chr10
  - chr11
  - chr12
  - chr13
  - chr14
  - chr15
  - chr16
  - chr17
  - chr18
  - chr19
  - chr20
  - chr21
  - chr22
  - chrX
  - chrY
gnomad_mito_vcf: "resources/gnomad_data/gnomad.genomes.v3.1.sites.chrM.vcf.bgz"   # chrM uses gnomAD v3.1

# CADD/SpliceAI pre-filters (which variants get run through each tool) --
# independent of the final filter below, defaulted to match it.
cadd_gnomad_af_threshold: 0.01
cadd_clnsig_filter:
  - "Benign"
  - "Likely_benign"
  - "Benign/Likely_benign"

spliceai_gnomad_af_threshold: 0.01
spliceai_clnsig_filter:
  - "Benign"
  - "Likely_benign"
  - "Benign/Likely_benign"

# filter_variants.py's final overall variant filters
gnomad_af_threshold:    0.01
clnsig_filter:
  - "Benign"
  - "Likely_benign"
  - "Benign/Likely_benign"
cadd_threshold:         15
spliceai_threshold:     0.2
final_dp_threshold: ""
final_af_threshold: ""

# ---------------------------------------------------------------------------
# Read phasing (rules/3_phase_reads.smk)
# ---------------------------------------------------------------------------
phasing_threshold:      0.5   # min proportion of a read's coverage that must phase to haplotypes to be used
terminal_variant_proportion: 0.5  # do not phase on variants that appear at the end of a read more frequently thatn this 
min_dist_from_read_end_variant_phasing: 20   # min distance (bp) from a read's end for a variant to be used in phasing

# ---------------------------------------------------------------------------
# Allele-specific expression (rules/4_ase_analysis.smk)
# ---------------------------------------------------------------------------
sample_coverage_threshold: 20
padj_threshold:         0.01
haplotype_ratio_threshold: 0.2
ase_phasing_threshold:  0.5   # min fraction of max coverage phased to haplotypes for an ASE call to be trusted

# ---------------------------------------------------------------------------
# Splice junction outlier analysis vs. GTEx (rules/5_junction_analysis.smk)
# ---------------------------------------------------------------------------
gtex_data_dir: "resources/gtex_data"
gtex_coverage_threshold:   20
gtex_n_threshold:          100
delta_psi_threshold:    0.1
jxn_phasing_threshold:  0.8   # min fraction of bulk coverage a junction's hap1+hap2 must reach to be trusted

# ---------------------------------------------------------------------------
# Cohort-level junction outlier analysis (rules/7_cohort_junction_analysis.smk)
# Compares each sample against its own (bed, sample_type) cohort rather than GTEx.
# Two methods -- "beta_binomial" (Beta fit + beta-binomial test, FDR-corrected) 
# or "modified_zscore" (median/MAD-based, no distribution fit).
# cohort_jxn_method: "auto" picks beta_binomial at/above cohort_jxn_beta_min_samples bulk samples, else modified_zscore; 
# or force one method for every group. Groups below cohort_jxn_min_samples are skipped entirely.
# ---------------------------------------------------------------------------
cohort_jxn_min_samples:        10
cohort_jxn_method:       "auto"     # "auto", "beta_binomial", or "modified_zscore"
cohort_jxn_beta_min_samples:   30
cohort_jxn_beta_padj_threshold: 0.05   # beta_binomial only; deliberately separate from padj_threshold above
cohort_jxn_z_threshold:       3.5      # modified_zscore only: |modZ| >= this flags an outlier (paired with delta below)
cohort_jxn_z_delta_threshold: 0.1      # modified_zscore only, paired with modZ above
cohort_jxn_phasing_threshold: 0.8      # min fraction of bulk coverage a junction's hap1+hap2 must reach to be trusted
cohort_jxn_beta_n_threshold:     30
cohort_jxn_zscore_n_threshold:   10
cohort_jxn_min_reads:          20   # a junction needs >= this many reads in >=1 bulk sample to be tested at all

# ---------------------------------------------------------------------------
# Top-level output directory (rules/6_merge_hits.smk, rules/7-9)
# Normally set in the run config YAML or via --config output_dir=<path>.
# ---------------------------------------------------------------------------
output_dir: ""
omim_file: "resources/omim_data/OMIM.tsv"

merge_num_callers_threshold_snv:       2
merge_num_callers_threshold_indel:     2
merge_min_dp_snv:                     20
merge_min_dp_indel:                   20
merge_variant_sample_fraction:         0.05   # a variant present in > this fraction of a group's samples is dropped

merge_min_haplotype_ratio:             0.1
merge_delta_haplotype_ratio_threshold: 0.2
merge_ase_padj_threshold:              0.01
merge_ase_sample_fraction:             0.05   # a gene with ASE in > this fraction of a group's samples is dropped

merge_jxn_coverage_threshold:         50
merge_jxn_padj_threshold:              0.01
merge_delta_psi_threshold:             0.1
merge_jxn_sample_fraction:              0.01  # a junction that's an outlier in > this fraction of a group's samples is dropped

# ---------------------------------------------------------------------------
# Sample-type validation (rules/8_validate_sample_types.smk)
# ---------------------------------------------------------------------------
validate_ref_tissues: ["fibroblasts", "lymphocytes", "wholeblood"]
validate_ref_colors:  ["#D95D5B", "#57AA3E", "#B271AB"]

# Optional per-sample_type plot colors; unlisted types get an auto-assigned color (see sample_type_color() in the Snakefile).
sample_type_colors:
  fibroblasts: "#D95D5B"
  lymphocytes: "#57AA3E"
  PBMCs: "#4C8FCA"
  wholeblood: "#B271AB"

# ---------------------------------------------------------------------------
# Cohort-wide QC plots (rules/9_plot_cohort_info.smk)
# ---------------------------------------------------------------------------
cohort_qc_title: "Cohort QC"   # shared title for both _9A and _9B

# ---------------------------------------------------------------------------
# Relative gene expression quantification (rules/10_quantify_genes.smk)
# No external tool -- read count (_10A), max coverage (_10B), or
# splice-site-sharing read assignment (_10D). CPTM normalization details in
# rules/10_quantify_genes.smk's module docstring.
# ---------------------------------------------------------------------------
gene_quant_title: null   # overrides the default title for _10A/_10B/_10D if set

# ---------------------------------------------------------------------------
# Resource defaults (override per rule if needed)
# ---------------------------------------------------------------------------
threads: 8
time:    1440   # default runtime in minutes (resources.runtime), converted to HH:MM:SS for sbatch --time
