name: RNA-Dx-compile-variants
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.*
  # >=8.25.2, <9: needed for CADD.sh's own `--sdm conda` call.
  - snakemake>=8.25.2,<9
  - htslib>=1.18
  - samtools>=1.18
  - bcftools>=1.18
  - tabix
  - pysam>=0.24.0
  # <2.3.0 for spliceai==1.3.1 compatibility.
  - numpy>=1.21.0,<2.3
  - pandas>=2.3.0
  - perl>=5.32.0
  - pip
  # Needed for spliceai==1.3.1's own pkg_resources import.
  - setuptools<81
  # Installed via pip (not conda) to avoid a slow/conflict-prone solve against TensorFlow's dependency tree. 
  - pip:
      - tensorflow
      - spliceai>=1.3.1
